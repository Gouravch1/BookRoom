spring.config.import=optional:file:.env[.properties]
spring.application.name=bookroom


 # Database configuration – values taken from environment (or .env file)
 spring.datasource.url=${SPRING_DATASOURCE_URL}
 spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
 spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
 
# JWT configuration – keep secret out of source control. No fallback default; must be provided via environment or .env
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

 # Cloudinary – load from env (or .env) – keep keys secret
 cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
 cloudinary.api-key=${CLOUDINARY_API_KEY}
 cloudinary.api-secret=${CLOUDINARY_API_SECRET}

 # Groq LLM API – secret via env variable
 groq.api-key=${GROQ_API_KEY}
 groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
# Configure server port for Cloud Run
server.port=${PORT:8080}